name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          # Busca donde esta realmente
          find. -name "*.xcodeproj"
          PROJ="repo-azul-31055/3105-2.0/ThreeOneOSFive.xcodeproj"
          # Si tienes la carpeta doble, usa esta:
          if [! -d "$PROJ" ]; then
            PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          fi
          echo "USANDO PROYECTO: $PROJ"

          xcodebuild -project "$PROJ" \
            -target 3105 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SYMROOT=$(pwd)/build build

          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL
          path: azul.ipa
