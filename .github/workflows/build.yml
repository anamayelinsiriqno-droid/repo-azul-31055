name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          unzip -o Slowthv7-3105-2.0-source.zip

      - name: Compilar IPA
        run: |
          PROJ=$(ls -d 3105-2.0/*.xcodeproj | head -n 1)
          xcodebuild -project "$PROJ" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT=$(pwd)/build SWIFT_TREAT_WARNINGS_AS_ERRORS=NO COMPILER_INDEX_STORE_ENABLE=NO build | tee build.log
          echo "--- ERRORES ---"
          grep -A5 "error:" build.log | head -n 100
          mkdir -p Payload
          cp -R build/Release-iphoneos/*.app Payload/ || true
          zip -r azul.ipa Payload || true

      - name: Subir IPA y Log
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: |
            azul.ipa
            build.log
