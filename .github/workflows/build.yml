name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          if ls *.zip 1>/dev/null 2>&1; then for z in *.zip; do unzip -o "$z"; rm "$z"; done; fi
      - name: Build
        run: |
          PROJ="./3105-2.0/ThreeOneOSFive.xcodeproj"
          xcodebuild -project "$PROJ" -alltargets -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=build/Build
          ls -R build
          APP=$(find . -name "*.app" | head -n 1)
          echo "APP: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: "*.ipa"
