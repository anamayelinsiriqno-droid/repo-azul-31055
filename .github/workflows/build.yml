name: Build 3105

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile 3105 IPA
    runs-on: macos-26

    env:
      TARGET: "3105"
      CONFIGURATION: "Release"
      SDK: "iphoneos"

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. MOSTRAR EXACTAMENTE LO QUE HAY EN EL REPOSITORIO
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd
          echo

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -print \
            | sort

          echo
          echo "ZIP FILES:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -print

      # ============================================================
      # 3. ENCONTRAR Y EXTRAER LA SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/source"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print \
              | head -n 1
          )"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::No se encontró ningún ZIP con la source de 3105."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"
          echo

          echo "Extrayendo..."

          /usr/bin/unzip \
            -q \
            "$ZIP_FILE" \
            -d "$SOURCE_DIR"

          echo
          echo "Source extraída."
          echo

          echo "Buscando proyectos Xcode:"

          find "$SOURCE_DIR" \
            -type d \
            -name "*.xcodeproj" \
            -print

      # ============================================================
      # 4. SELECCIONAR XCODE 26.6
      # ============================================================

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.6.app/Contents/Developer"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26.6 no está instalado en este runner."
            echo
            echo "Xcode disponibles:"
            ls -1 /Applications \
              | grep -i "^Xcode" \
              || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version

      # ============================================================
      # 5. ENCONTRAR EL XCODEPROJ
      # ============================================================

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/source"

          PROJECT_PATH="$(
            find "$SOURCE_DIR" \
              -type d \
              -name "*.xcodeproj" \
              -print \
              | head -n 1
          )"

          if [[ -z "$PROJECT_PATH" ]]; then
            echo "::error::No se encontró ningún .xcodeproj después de extraer la source."

            echo
            echo "Estructura de source:"
            find "$SOURCE_DIR" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo "XCODE PROJECT"
          echo "=========================================="

          echo "$PROJECT_PATH"

          if [[ ! -f "$PROJECT_PATH/project.pbxproj" ]]; then
            echo "::error::El proyecto no contiene project.pbxproj."
            exit 1
          fi

          echo
          echo "project.pbxproj encontrado."

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 6. VERIFICAR EL PROYECTO
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XCODE PROJECT CHECK"
          echo "=========================================="

          echo "Proyecto:"
          echo "$PROJECT_PATH"

          echo
          echo "Contenido:"
          ls -la "$PROJECT_PATH"

          echo
          echo "=========================================="
          echo "XCODEBUILD -LIST"
          echo "=========================================="

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      # ============================================================
      # 7. VERIFICAR QUE EL TARGET 3105 EXISTA
      # ============================================================

      - name: Verify 3105 target
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY TARGET"
          echo "=========================================="

          TARGET_LIST="$(
            xcodebuild \
              -project "$PROJECT_PATH" \
              -list
          )"

          echo "$TARGET_LIST"

          if ! echo "$TARGET_LIST" | grep -Eq '(^|[[:space:]])3105([[:space:]]|$)'; then
            echo
            echo "::error::El target 3105 no aparece en xcodebuild -list."
            exit 1
          fi

          echo
          echo "Target 3105 encontrado correctamente."

      # ============================================================
      # 8. MOSTRAR BUILD SETTINGS
      # ============================================================

      - name: Inspect build settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -showBuildSettings \
            | tee build-settings.log

      # ============================================================
      # 9. LIMPIAR
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            clean

      # ============================================================
      # 10. ARCHIVE
      #
      # IMPORTANTE:
      # Se desactiva la firma para poder compilar desde GitHub
      # sin certificados/provisioning profiles privados.
      # ============================================================

      - name: Archive application
        shell: bash
        run: |
          set -o pipefail

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/3105.xcarchive"
          DERIVED_DATA="$GITHUB_WORKSPACE/build/DerivedData"

          mkdir -p "$GITHUB_WORKSPACE/build"

          echo "=========================================="
          echo "BUILD / ARCHIVE"
          echo "=========================================="

          xcodebuild \
            -project "$PROJECT_PATH" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee "$GITHUB_WORKSPACE/build/build.log"

      # ============================================================
      # 11. COMPROBAR QUE EL ARCHIVE EXISTE
      # ============================================================

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/3105.xcarchive"

          echo "=========================================="
          echo "ARCHIVE"
          echo "=========================================="

          if [[ ! -d "$ARCHIVE_PATH" ]]; then
            echo "::error::El XCARCHIVE no fue generado."
            exit 1
          fi

          ls -lah "$ARCHIVE_PATH"

          echo
          echo "ArchiveInfo:"
          find "$ARCHIVE_PATH" \
            -maxdepth 3 \
            -print \
            | sort

      # ============================================================
      # 12. ENCONTRAR EL APP
      # ============================================================

      - name: Locate application
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/3105.xcarchive"

          APP_PATH="$(
            find "$ARCHIVE_PATH/Products/Applications" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No se encontró 3105.app dentro del archive."

            echo
            echo "Contenido del archive:"
            find "$ARCHIVE_PATH" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo "APP"
          echo "=========================================="

          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 13. COMPROBAR INFO DEL APP
      # ============================================================

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION"
          echo "=========================================="

          ls -lah "$APP_PATH"

          echo
          echo "Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" \
            || true

      # ============================================================
      # 14. CREAR IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$GITHUB_WORKSPACE/build"
          IPA_PATH="$BUILD_DIR/3105-unsigned.ipa"

          rm -rf "$BUILD_DIR/Payload"
          rm -f "$IPA_PATH"

          mkdir -p "$BUILD_DIR/Payload"

          cp -R \
            "$APP_PATH" \
            "$BUILD_DIR/Payload/3105.app"

          cd "$BUILD_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          echo
          echo "=========================================="
          echo "IPA"
          echo "=========================================="

          ls -lh "$IPA_PATH"

          /usr/bin/file "$IPA_PATH"

          echo
          echo "Contenido IPA:"
          /usr/bin/unzip -l "$IPA_PATH"

      # ============================================================
      # 15. SUBIR IPA
      # ============================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. SUBIR ARCHIVE
      # ============================================================

      - name: Upload XCArchive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-xcarchive
          path: build/3105.xcarchive
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 17. SUBIR LOGS SIEMPRE
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-diagnostics
          path: |
            build/build.log
            build-settings.log
          if-no-files-found: warn
          retention-days: 30
