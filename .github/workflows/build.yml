name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and AutoFix
        run: |
          if ls *.zip 1>/dev/null 2>&1; then for z in *.zip; do unzip -o "$z"; rm "$z"; done; fi
          
          echo "=== PARCHANDO SOURCE DE CHATGPT ==="
          # 1. Fix OnboardingStep
          find . -name "*.swift" -exec sed -i '' 's/if step != .language/if step != .welcome/g' {} \; || true
          find . -name "*.swift" -exec sed -i '' 's/.language/.welcome/g' {} \; || true
          
          # 2. Fix windows deprecated (SettingsView)
          find . -name "*.swift" -exec sed -i '' 's/UIApplication.shared.windows.first/UIApplication.shared.connectedScenes.flatMap { ($0 as? UIWindowScene)?.windows ?? [] }.first/g' {} \; || true
          
          # 3. Fix Color hex que ChatGPT inventa
          grep -r "Color(hex" --include="*.swift" . | head

      - name: Build
        run: |
          set -o pipefail
          PROJ="./3105-2.0/ThreeOneOSFive.xcodeproj"
          xcodebuild -project "$PROJ" -alltargets -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=3105-2.0/build/Build 2>&1 | tee build.log
          echo "--- ERRORES REALES ---"
          grep -E "error:" build.log | head -n 20
          APP=$(find 3105-2.0 -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
