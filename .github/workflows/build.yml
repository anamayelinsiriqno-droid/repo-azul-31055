name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          echo "Using: $PROJ"
          xcodebuild -project "$PROJ" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=$(pwd)/build -destination 'generic/platform=iOS' build
          mkdir -p Payload
          find build -name "*.app" -type d | head -n 1 | xargs -I {} cp -R {} Payload/
          zip -r app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: app-unsigned.ipa
