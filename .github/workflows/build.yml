name: Slowth - Build IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        shell: bash
        run: |
          set -e

          XCODE=""
          for APP in /Applications/Xcode_15*.app /Applications/Xcode.app; do
            if [ -d "$APP" ]; then
              VERSION="$("$APP/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -n 1 || true)"
              case "$VERSION" in
                Xcode\ 15.*)
                  XCODE="$APP"
                  ;;
              esac
            fi
          done

          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 15 was not found on the GitHub runner."
            echo "Available Xcodes:"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print
            exit 1
          fi

          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          sudo xcodebuild -license accept

          xcodebuild -version
          xcode-select -p

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find . -type d -name "*.xcworkspace" \
            -not -path "./Pods/*" \
            -not -path "./Carthage/*" | head -n 1 || true)

          PROJECT=$(find . -type d -name "*.xcodeproj" \
            -not -path "./Pods/*" \
            -not -path "./Carthage/*" | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Project type: workspace"
            echo "Project: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Project type: project"
            echo "Project: $PROJECT"
          else
            echo "::error::No .xcodeproj or .xcworkspace was found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort | head -n 300
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f "Podfile" ]; then
            sudo gem install cocoapods --no-document
            pod install
          fi

      - name: Find scheme
        id: scheme
        shell: bash
        run: |
          set -e

          TYPE="${{ steps.project.outputs.type }}"
          PATH_NAME="${{ steps.project.outputs.path }}"

          if [ "$TYPE" = "workspace" ]; then
            xcodebuild -workspace "$PATH_NAME" -list | tee xcode-list.txt
          else
            xcodebuild -project "$PATH_NAME" -list | tee xcode-list.txt
          fi

          # Use SLOWTH_SCHEME if it was defined as a repository variable.
          if [ -n "${SLOWTH_SCHEME:-}" ]; then
            SCHEME="$SLOWTH_SCHEME"
          else
            SCHEME=$(
              awk '
                /^Schemes:/ { found=1; next }
                found && /^[[:space:]]+[A-Za-z0-9_.-]+$/ {
                  gsub(/^[[:space:]]+/, "", $0);
                  print;
                  exit
                }
              ' xcode-list.txt
            )
          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::No shared Xcode scheme was found."
            cat xcode-list.txt
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build
        shell: bash
        run: |
          set -e

          TYPE="${{ steps.project.outputs.type }}"
          PATH_NAME="${{ steps.project.outputs.path }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          rm -rf build

          ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )

          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$PATH_NAME" \
              "${ARGS[@]}" \
              clean build
          else
            xcodebuild \
              -project "$PATH_NAME" \
              "${ARGS[@]}" \
              clean build
          fi

      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d -name "*.app" \
            -path "*Release-iphoneos/*" \
            -not -path "*/Index.noindex/*" |
            head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::The build did not produce an .app"
            find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          echo "APP=$APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          cd build
          /usr/bin/zip -qry Slowth-DarkFantasy.ipa Payload
          test -f Slowth-DarkFantasy.ipa
          ls -lh Slowth-DarkFantasy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slowth-DarkFantasy
          path: build/Slowth-DarkFantasy.ipa
          if-no-files-found: error
          retention-days: 30
