name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir y Parchear TODO
        run: |
          unzip -o Slowthv7-3105-2.0-source.zip
          APP_FILE=$(find 3105-2.0 -name "App.swift" | head -n 1)
          echo "Archivo a parchear: $APP_FILE"

          python3 << 'PY'
          import pathlib, re
          app_file = pathlib.Path(list(pathlib.Path("3105-2.0").rglob("App.swift"))[0])
          code = app_file.read_text()

          # FIX 1: OnboardingStore
          code = code.replace("OnboardingStore.shouldShow()", "false")
          code = code.replace("OnboardingStore.markCompleted()", 'UserDefaults.standard.set(true, forKey: "onboarding.completed")')
          code = re.sub(r'.*OnboardingStore.*\n', '', code)

          # FIX 2: phase in (el que te daba error)
          code = code.replace(".onChange(of: scenePhase) { phase in", ".onChange(of: scenePhase) {")
          code = code.replace("guard phase ==.active", "guard scenePhase ==.active")
          code = code.replace("guard phase ==.active", "guard scenePhase ==.active")
          code = code.replace("phase ==.active", "scenePhase ==.active")
          code = code.replace("phase ==.active", "scenePhase ==.active")
          # por si quedó un 'phase' suelto
          code = re.sub(r'\bphase\b', 'scenePhase', code)

          # FIX 3: Si queda.onChange viejo con 2 parametros
          code = re.sub(r'\.onChange\(of: scenePhase\)\s*\{\s*scenePhase in', '.onChange(of: scenePhase) {', code)

          app_file.write_text(code)
          print("Parche aplicado OK")
          print(code[1500:3000])
          PY

      - name: Compilar IPA
        run: |
          PROJ=$(ls -d 3105-2.0/*.xcodeproj | head -n 1)
          SCHEME=$(basename "$PROJ".xcodeproj)
          # Intenta detectar el scheme real, si no usa 3105
          if xcodebuild -list -project "$PROJ" | grep -q "3105"; then
            SCHEME="3105"
          fi
          echo "Proyecto: $PROJ Scheme: $SCHEME"

          xcodebuild -project "$PROJ" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=$(pwd)/build build 2>&1 | tee build.log

          echo "---- RESUMEN ERRORES ----"
          grep -i "error:" build.log | tail -n 100 || echo "Sin errores de compilacion"

          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
          echo "APP encontrada: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r azul.ipa Payload
          ls -lh azul.ipa

      - name: Subir IPA y Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: |
            azul.ipa
            build.log
