ersion
          xcode-select -p
          swift --version

      - name: Install CocoaPods dependencies if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Podfile" ]; then
            sudo gem install cocoapods --no-document
            pod install --repo-update
          fi

      - name: Find Xcode project
        id: find_project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find . -maxdepth 4 -type d -name '*.xcworkspace' \
            ! -path '*/Pods/*' | sort | head -n 1 || true)"

          PROJECT="$(find . -maxdepth 4 -type d -name '*.xcodeproj' \
            ! -path '*/Pods/*' | sort | head -n 1 || true)"

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Found workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Found project: $PROJECT"
          else
            echo "::error::No .xcodeproj or .xcworkspace was found."
            echo "Put the complete Xcode source in the repository before running this workflow."
            exit 1
          fi

      - name: Find application scheme
        id: find_scheme
        shell: bash
        run: |
          set -euo pipefail

          TYPE="${{ steps.find_project.outputs.type }}"
          PATH_TO_PROJECT="${{ steps.find_project.outputs.path }}"

          if [ "$TYPE" = "workspace" ]; then
            LIST="$(xcodebuild -workspace "$PATH_TO_PROJECT" -list)"
          else
            LIST="$(xcodebuild -project "$PATH_TO_PROJECT" -list)"
          fi

          echo "$LIST"

          # Prefer a scheme containing Slowth or Filza.
          SCHEME="$(printf '%s\n' "$LIST" |
            sed -n '/Schemes:/,$p' |
            sed '1d' |
            sed 's/^[[:space:]]*//' |
            grep -E -i '^(Slowth|Filza)' |
            head -n 1 || true)"

          # Otherwise use the first available scheme.
          if [ -z "$SCHEME" ]; then
            SCHEME="$(printf '%s\n' "$LIST" |
              sed -n '/Schemes:/,$p' |
              sed '1d' |
              sed 's/^[[:space:]]*//' |
              sed '/^$/d' |
              head -n 1 || true)"
          fi

          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme was found."
            exit 1
          fi

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          TYPE="${{ steps.find_project.outputs.type }}"
          PATH_TO_PROJECT="${{ steps.find_project.outputs.path }}"
          SCHEME="${{ steps.find_scheme.outputs.scheme }}"

          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$PATH_TO_PROJECT" \
              -scheme "$SCHEME" \
              -resolvePackageDependencies
          else
            xcodebuild \
              -project "$PATH_TO_PROJECT" \
              -scheme "$SCHEME" \
              -resolvePackageDependencies
          fi

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          TYPE="${{ steps.find_project.outputs.type }}"
          PATH_TO_PROJECT="${{ steps.find_project.outputs.path }}"
          SCHEME="${{ steps.find_scheme.outputs.scheme }}"

          rm -rf "$GITHUB_WORKSPACE/build"

          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData"

            # Keep the app unsigned so it can be signed separately for the
            # user's jailbreak/install workflow.
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""

            # Enforce the requested minimum OS at build time.
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET"
          )

          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$PATH_TO_PROJECT" \
              "${COMMON_ARGS[@]}" \
              clean build
          else
            xcodebuild \
              -project "$PATH_TO_PROJECT" \
              "${COMMON_ARGS[@]}" \
              clean build
          fi

      - name: Locate built .app
        id: find_app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -type d \
            -path '*Release-iphoneos/*.app' \
            ! -path '*/Index.noindex/*' |
            sort |
            head -n 1 || true)"

          if [ -z "$APP" ]; then
            echo "::error::xcodebuild finished without producing an iOS .app."
            find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Built app: $APP"

      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.find_app.outputs.app }}"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::Built app has no Info.plist."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.find_app.outputs.app }}"

          rm -rf "$GITHUB_WORKSPACE/build/Payload"
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"

          cp -R "$APP" "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"
          rm -f Slowth-DarkFantasy.ipa

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload Slowth-DarkFantasy.ipa

          test -s Slowth-DarkFantasy.ipa
          ls -lh Slowth-DarkFantasy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slowth-DarkFantasy-IPA
          path: build/Slowth-DarkFantasy.ipa
          if-no-files-found: error
          retention-days: 30
