name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y Parchear
        run: |
          unzip -o Slowthv7-3105-2.0-source.zip
          APP_FILE=$(find 3105-2.0 -name "App.swift" | head -n 1)
          echo "Parcheando: $APP_FILE"

          # Fix OnboardingStore
          sed -i '' 's/OnboardingStore.shouldShow()/false/g' "$APP_FILE" 2>/dev/null || sed -i 's/OnboardingStore.shouldShow()/false/g' "$APP_FILE"
          sed -i '' 's/OnboardingStore.markCompleted()/UserDefaults.standard.set(true, forKey: "onboarding.completed")/g' "$APP_FILE" 2>/dev/null || sed -i 's/OnboardingStore.markCompleted()/UserDefaults.standard.set(true, forKey: "onboarding.completed")/g' "$APP_FILE"

          # Fix onChange - ESTE ES EL FIX NUEVO
          sed -i '' 's/phase ==.active/scenePhase ==.active/g' "$APP_FILE" 2>/dev/null || sed -i 's/phase ==.active/scenePhase ==.active/g' "$APP_FILE"
          sed -i '' 's/guard phase/guard scenePhase/g' "$APP_FILE" 2>/dev/null || sed -i 's/guard phase/guard scenePhase/g' "$APP_FILE"
          sed -i '' 's/.onChange(of: scenePhase) { phase in/.onChange(of: scenePhase) {/g' "$APP_FILE" 2>/dev/null || sed -i 's/.onChange(of: scenePhase) { phase in/.onChange(of: scenePhase) {/g' "$APP_FILE"

          echo "Linea 88-95 parcheada:"
          sed -n '85,100p' "$APP_FILE"

      - name: Compilar IPA
        run: |
          PROJ=$(ls -d 3105-2.0/*.xcodeproj | head -n 1)
          xcodebuild -project "$PROJ" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT=$(pwd)/build build
          mkdir -p Payload
          cp -R build/Release-iphoneos/*.app Payload/
          zip -r azul.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: azul.ipa
