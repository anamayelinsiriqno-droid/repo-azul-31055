name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y Parchear TODO a iOS 17
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP"
          find. -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 16.0/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' {} \; 2>/dev/null || find. -name "project.pbxproj" -exec sed -i 's/IPHONEOS_DEPLOYMENT_TARGET = 16.0/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' {} \;

      - name: Compilar IPA
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$PROJ" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO IPHONEOS_DEPLOYMENT_TARGET=17.0 SYMROOT=$(pwd)/build build
          mkdir -p Payload
          APP=$(find build/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: azul.ipa
