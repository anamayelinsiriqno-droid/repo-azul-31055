name: Build 3105

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build 3105
    runs-on: macos-26

    env:
      TARGET: "3105"
      CONFIGURATION: "Release"
      SDK: "iphoneos"
      ARCHIVE_PATH: ${{ github.workspace }}/build/3105.xcarchive
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:

      # ==============================================
      # 1. Descargar el repositorio
      # ==============================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================================
      # 2. Mostrar exactamente lo que GitHub descargó
      # ==============================================
      - name: Debug repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DIRECTORIO ACTUAL"
          echo "=========================================="
          pwd

          echo
          echo "=========================================="
          echo "GITHUB WORKSPACE"
          echo "=========================================="
          echo "$GITHUB_WORKSPACE"

          echo
          echo "=========================================="
          echo "CONTENIDO DE LA RAÍZ"
          echo "=========================================="
          ls -la "$GITHUB_WORKSPACE"

          echo
          echo "=========================================="
          echo "TODOS LOS .XCODEPROJ"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type d \
            -name "*.xcodeproj" \
            -print

          echo
          echo "=========================================="
          echo "ARCHIVOS DEL REPOSITORIO"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type f \
            -print | sort | head -500

      # ==============================================
      # 3. Seleccionar Xcode
      # ==============================================
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "=========================================="
          echo "XCODE VERSION"
          echo "=========================================="

          xcodebuild -version

          echo
          echo "DEVELOPER DIRECTORY:"
          xcode-select -p

      # ==============================================
      # 4. Encontrar automáticamente el proyecto
      # ==============================================
      - name: Find Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando proyectos Xcode..."

          PROJECT_PATH="$(
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*.xcodeproj" \
              -print \
              -quit
          )"

          if [[ -z "$PROJECT_PATH" ]]; then

            echo "::error::No se encontró ningún .xcodeproj."

            echo
            echo "Proyectos disponibles:"
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*.xcodeproj" \
              -print || true

            echo
            echo "Contenido del repositorio:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -print | head -500

            exit 1
          fi

          echo
          echo "=========================================="
          echo "PROYECTO ENCONTRADO"
          echo "=========================================="

          echo "$PROJECT_PATH"

          PROJECT_RELATIVE="${PROJECT_PATH#$GITHUB_WORKSPACE/}"

          echo
          echo "Ruta relativa:"
          echo "$PROJECT_RELATIVE"

          echo "PROJECT=$PROJECT_RELATIVE" >> "$GITHUB_ENV"

          if [[ ! -f "$PROJECT_PATH/project.pbxproj" ]]; then
            echo "::error::No se encontró project.pbxproj."

            ls -la "$PROJECT_PATH"

            exit 1
          fi

          echo
          echo "project.pbxproj encontrado correctamente."

      # ==============================================
      # 5. Inspeccionar proyecto
      # ==============================================
      - name: Verify project
        shell: bash
        run: |
          set -uo pipefail

          echo "=========================================="
          echo "PROYECTO"
          echo "=========================================="

          echo "$PROJECT"

          echo
          echo "=========================================="
          echo "CONTENIDO"
          echo "=========================================="

          ls -la "$PROJECT"

          echo
          echo "=========================================="
          echo "XCODEBUILD -LIST"
          echo "=========================================="

          xcodebuild \
            -project "$PROJECT" \
            -list \
            2>&1 | tee verify-project.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "=========================================="
          echo "EXIT CODE: $STATUS"
          echo "=========================================="

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::xcodebuild -list falló."

            echo
            echo "LOG COMPLETO:"
            cat verify-project.log

            exit "$STATUS"
          fi

      # ==============================================
      # 6. Mostrar configuración del target
      # ==============================================
      - name: Show target settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -showBuildSettings \
            2>&1 | tee build-settings.log

      # ==============================================
      # 7. Limpiar proyecto
      # ==============================================
      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            clean

      # ==============================================
      # 8. Crear Archive
      # ==============================================
      - name: Archive
        shell: bash
        run: |
          set -o pipefail

          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee build/build.log

      # ==============================================
      # 9. Encontrar .app
      # ==============================================
      - name: Find application
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando aplicación compilada..."

          APP_PATH="$(
            find "$ARCHIVE_PATH/Products/Applications" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [[ -z "$APP_PATH" ]]; then

            echo "::error::No se encontró ninguna aplicación .app."

            echo
            echo "Contenido del archive:"

            find "$ARCHIVE_PATH" \
              -maxdepth 6 \
              -print || true

            exit 1
          fi

          echo
          echo "Aplicación encontrada:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ==============================================
      # 10. Crear IPA
      # ==============================================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/Payload
          rm -f build/3105-unsigned.ipa

          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            3105-unsigned.ipa \
            Payload

          echo
          echo "=========================================="
          echo "IPA CREADA"
          echo "=========================================="

          ls -lh 3105-unsigned.ipa

          file 3105-unsigned.ipa

      # ==============================================
      # 11. Subir IPA
      # ==============================================
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # ==============================================
      # 12. Subir logs
      # ==============================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-diagnostics
          path: |
            verify-project.log
            build-settings.log
            build/build.log
            build/3105.xcarchive
          if-no-files-found: warn
          retention-days: 14
