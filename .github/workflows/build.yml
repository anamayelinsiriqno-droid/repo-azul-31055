name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP"

      - name: Build
        run: |
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          if [ -z "$PROJ" ]; then PROJ=$(ls -d */*.xcodeproj 2>/dev/null | head -n 1); fi
          echo "Proyecto: $PROJ"

          # Fix iOS 17 en todo
          sed -i '' 's/16.0/17.0/g' "$PROJ/project.pbxproj" 2>/dev/null || true
          find. -name "Info.plist" -exec sed -i '' 's/16.0/17.0/g' {} \; 2>/dev/null || true

          set -o pipefail
          xcodebuild -project "$PROJ" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_ENTITLEMENTS="" SYMROOT=$(pwd)/build -skipPackagePluginValidation -skipMacroValidation build 2>&1 | tee build.log || (echo "---- ERROR REAL ----"; grep -i -A 10 "error:" build.log | tail -n 100; exit 65)

          mkdir -p Payload
          APP=$(ls -d build/Release-iphoneos/*.app | head -n 1)
          echo "APP: $APP"
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: azul.ipa
