name: Build 3105

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile 3105
    runs-on: macos-26

    env:
      TARGET: "3105"
      SCHEME: "3105"
      CONFIGURATION: "Release"
      SDK: "iphoneos"
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      ARCHIVE_PATH: ${{ github.workspace }}/build/3105.xcarchive

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. INSPECCIONAR REPOSITORIO
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd
          echo

          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -print \
            | sort

          echo
          echo "ZIP FILES:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -print

      # ============================================================
      # 3. EXTRAER SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print \
              | head -n 1
          )"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::No se encontró ningún ZIP con la source."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          echo
          echo "Extrayendo source..."

          /usr/bin/unzip \
            -q \
            "$ZIP_FILE" \
            -d "$SOURCE_DIR"

          echo
          echo "Proyectos Xcode encontrados:"

          find "$SOURCE_DIR" \
            -type d \
            -name "*.xcodeproj" \
            -print

      # ============================================================
      # 4. SELECCIONAR XCODE 26.6
      # ============================================================

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.6.app/Contents/Developer"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26.6 no está disponible."
            echo
            echo "Xcode instalados:"
            ls -1 /Applications \
              | grep -i "^Xcode" \
              || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version

      # ============================================================
      # 5. LOCALIZAR XCODEPROJ
      # ============================================================

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(
            find "$SOURCE_DIR" \
              -type d \
              -name "*.xcodeproj" \
              -print \
              | head -n 1
          )"

          if [[ -z "$PROJECT_PATH" ]]; then
            echo "::error::No se encontró ningún .xcodeproj."

            echo
            echo "Contenido de la source:"
            find "$SOURCE_DIR" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          if [[ ! -f "$PROJECT_PATH/project.pbxproj" ]]; then
            echo "::error::No se encontró project.pbxproj."
            exit 1
          fi

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          echo "$PROJECT_PATH"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 6. VERIFICAR PROYECTO Y TARGET
      # ============================================================

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XCODEBUILD -LIST"
          echo "=========================================="

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Verify target
        shell: bash
        run: |
          set -euo pipefail

          TARGET_LIST="$(
            xcodebuild \
              -project "$PROJECT_PATH" \
              -list
          )"

          echo "$TARGET_LIST"

          if ! echo "$TARGET_LIST" | grep -Eq '(^|[[:space:]])3105([[:space:]]|$)'; then
            echo "::error::No se encontró el target 3105."
            exit 1
          fi

          echo
          echo "Target 3105 encontrado."

      # ============================================================
      # 7. CREAR SCHEME COMPARTIDO
      #
      # La source no trae un xcscheme compartido.
      # Lo generamos aquí para que archive pueda usar -scheme.
      # ============================================================

      - name: Create shared scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$PROJECT_PATH"

          PROJECT_NAME="$(
            basename "$PROJECT_DIR" .xcodeproj
          )"

          SCHEMES_DIR="$PROJECT_DIR/xcshareddata/xcschemes"

          mkdir -p "$SCHEMES_DIR"

          SCHEME_FILE="$SCHEMES_DIR/${SCHEME}.xcscheme"

          echo "=========================================="
          echo "CREATING SCHEME"
          echo "=========================================="

          echo "Project:"
          echo "$PROJECT_NAME"

          echo "Target:"
          echo "$TARGET"

          echo "Scheme:"
          echo "$SCHEME"

          cat > "$SCHEME_FILE" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme
   LastUpgradeVersion = "2660"
   version = "1.7">

   <BuildAction
      parallelizeBuildables = "YES"
      buildImplicitDependencies = "YES">

      <BuildActionEntries>

         <BuildActionEntry
            buildForTesting = "YES"
            buildForRunning = "YES"
            buildForProfiling = "YES"
            buildForArchiving = "YES"
            buildForAnalyzing = "YES">

            <BuildableReference
               BuildableIdentifier = "primary"
               BlueprintIdentifier = "$(TARGET_ID)"
               BuildableName = "3105.app"
               BlueprintName = "3105"
               ReferencedContainer = "container:$(PROJECT_NAME).xcodeproj">
            </BuildableReference>

         </BuildActionEntry>

      </BuildActionEntries>

   </BuildAction>

   <TestAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      shouldUseLaunchSchemeArgsEnv = "YES">

   </TestAction>

   <LaunchAction
      buildConfiguration = "Debug"
      selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
      selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
      launchStyle = "0"
      useCustomWorkingDirectory = "NO"
      ignoresPersistentStateOnLaunch = "NO"
      debugDocumentVersioning = "YES"
      debugServiceExtension = "internal"
      allowLocationSimulation = "YES">

   </LaunchAction>

   <ProfileAction
      buildConfiguration = "Release"
      shouldUseLaunchSchemeArgsEnv = "YES"
      savedToolIdentifier = ""
      useCustomWorkingDirectory = "NO"
      debugDocumentVersioning = "YES">

   </ProfileAction>

   <AnalyzeAction
      buildConfiguration = "Debug">
   </AnalyzeAction>

   <ArchiveAction
      buildConfiguration = "Release"
      revealArchiveInOrganizer = "YES"
      enableCloudSigning = "NO">
   </ArchiveAction>

</Scheme>
EOF

          # Reemplazar variables que Xcode no resolvería dentro
          # del heredoc.
          PROJECT_BASENAME="$PROJECT_NAME.xcodeproj"

          sed -i '' \
            "s/\$(PROJECT_NAME)/$PROJECT_NAME/g" \
            "$SCHEME_FILE"

          # Obtener el BlueprintIdentifier real del target 3105.
          TARGET_ID="$(
            xcodebuild \
              -project "$PROJECT_PATH" \
              -target "$TARGET" \
              -showBuildSettings \
              2>/dev/null \
              | awk -F' = ' '/TARGETED_DEVICE_FAMILY/ {found=1} found && /PRODUCT_BUNDLE_IDENTIFIER/ {print; exit}' \
              || true
          )"

          # Obtener el ID del target directamente del pbxproj.
          REAL_TARGET_ID="$(
            grep -B 5 -A 20 \
              'name = 3105;' \
              "$PROJECT_PATH/project.pbxproj" \
              | grep 'isa = PBXNativeTarget' -B 20 \
              | grep -E '^[[:space:]]*[A-F0-9]{24} /\\*' \
              | head -n 1 \
              | sed -E 's/^.*([A-F0-9]{24}).*$/\1/' \
              || true
          )"

          if [[ -z "$REAL_TARGET_ID" ]]; then
            REAL_TARGET_ID="$(
              awk '
                /isa = PBXNativeTarget;/ {
                  id=$1
                  block=1
                  name=""
                }

                block && /name = 3105;/ {
                  print id
                  exit
                }

                block && /^};/ {
                  block=0
                }
              ' "$PROJECT_PATH/project.pbxproj"
            "
          fi

          if [[ -z "$REAL_TARGET_ID" ]]; then
            echo "::error::No se pudo obtener el BlueprintIdentifier del target 3105."
            exit 1
          fi

          echo "BlueprintIdentifier:"
          echo "$REAL_TARGET_ID"

          sed -i '' \
            "s/\$(TARGET_ID)/$REAL_TARGET_ID/g" \
            "$SCHEME_FILE"

          echo
          echo "Scheme creado:"
          cat "$SCHEME_FILE"

      # ============================================================
      # 8. VERIFICAR SCHEME
      # ============================================================

      - name: Verify scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AVAILABLE SCHEMES"
          echo "=========================================="

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

          echo
          echo "Scheme file:"

          find "$PROJECT_PATH" \
            -path "*xcshareddata/xcschemes/*.xcscheme" \
            -print

      # ============================================================
      # 9. BUILD SETTINGS
      # ============================================================

      - name: Inspect build settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -showBuildSettings \
            | tee build-settings.log

      # ============================================================
      # 10. LIMPIAR
      # ============================================================

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$BUILD_DIR"

          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            clean

      # ============================================================
      # 11. ARCHIVE
      #
      # AQUÍ ESTÁ EL CAMBIO PRINCIPAL:
      # -scheme en lugar de -target
      # ============================================================

      - name: Archive application
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILD / ARCHIVE"
          echo "=========================================="

          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee "$BUILD_DIR/build.log"

      # ============================================================
      # 12. VERIFICAR ARCHIVE
      # ============================================================

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ARCHIVE"
          echo "=========================================="

          if [[ ! -d "$ARCHIVE_PATH" ]]; then
            echo "::error::No se generó el XCArchive."
            exit 1
          fi

          ls -lah "$ARCHIVE_PATH"

          echo
          echo "Products:"

          find "$ARCHIVE_PATH/Products" \
            -maxdepth 4 \
            -print \
            | sort

      # ============================================================
      # 13. ENCONTRAR APP
      # ============================================================

      - name: Locate application
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(
            find "$ARCHIVE_PATH/Products/Applications" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              | head -n 1
          )"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No se encontró ningún .app."

            echo
            echo "Contenido del archive:"

            find "$ARCHIVE_PATH" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo
          echo "App encontrada:"
          echo "$APP_PATH"

      # ============================================================
      # 14. INFORMACIÓN DE LA APP
      # ============================================================

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLICATION"
          echo "=========================================="

          ls -lah "$APP_PATH"

          echo
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" \
            || true

          echo
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" \
            || true

      # ============================================================
      # 15. CREAR IPA UNSIGNED
      # ============================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="$BUILD_DIR/3105-unsigned.ipa"

          rm -rf "$BUILD_DIR/Payload"
          rm -f "$IPA_PATH"

          mkdir -p "$BUILD_DIR/Payload"

          cp -R \
            "$APP_PATH" \
            "$BUILD_DIR/Payload/3105.app"

          cd "$BUILD_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          echo
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh "$IPA_PATH"

          /usr/bin/file "$IPA_PATH"

          echo
          echo "IPA CONTENTS:"

          /usr/bin/unzip -l "$IPA_PATH"

      # ============================================================
      # 16. SUBIR IPA
      # ============================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 17. SUBIR XCARCHIVE
      # ============================================================

      - name: Upload XCArchive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-xcarchive
          path: build/3105.xcarchive
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 18. SUBIR LOGS SI FALLA
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-diagnostics
          path: |
            build/build.log
            build-settings.log
          if-no-files-found: warn
          retention-days: 30
