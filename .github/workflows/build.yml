name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: find
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          echo "Found: $PROJ"
          echo "proj=$PROJ" >> $GITHUB_OUTPUT
      - name: Build IPA
        run: |
          xcodebuild -project "${{ steps.find.outputs.proj }}" -scheme ThreeOneOSFive -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES SYMROOT=$(pwd)/build/Build -destination 'generic/platform=iOS' build
          mkdir -p Payload
          cp -R build/Build/Release-iphoneos/*.app Payload/
          zip -r app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: app-unsigned.ipa
