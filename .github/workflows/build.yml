name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Build
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          echo "Proyecto: $PROJ"
          # Limpia assets rotos y compila
          xcodebuild -project "$PROJ" -target 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=15.0 SWIFT_VERSION=5.0 SYMROOT=$(pwd)/build build
          APP=$(find./build -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-FIXED
          path: azul.ipa
