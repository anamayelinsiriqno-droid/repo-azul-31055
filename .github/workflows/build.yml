name: Build IPA Unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned
        run: |
          set -e

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Create unsigned IPA
        run: |
          set -e

          mkdir -p Payload

          APP=$(find "$GITHUB_WORKSPACE/build" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el .app"
            exit 1
          fi

          cp -R "$APP" Payload/

          zip -qry "Slowthv7-3105-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slowthv7-3105-unsigned
          path: Slowthv7-3105-unsigned.ipa
