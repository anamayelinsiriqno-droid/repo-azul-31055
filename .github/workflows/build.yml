name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          echo "PROJ=$PROJ"
          xcodebuild -project "$PROJ" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" SYMROOT=$(pwd)/build -destination 'generic/platform=iOS' build || true
          APP=$(find. -path "*/build/Build/Products/Release-iphoneos/*.app" | head -n 1)
          if [ -z "$APP" ]; then APP=$(find build -name "*.app" | head -n 1); fi
          echo "APP=$APP"
          ls -R build || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: app-unsigned.ipa
