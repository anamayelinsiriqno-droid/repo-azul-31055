name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build IPA
        run: |
          xcodebuild -version
          echo "Archivos:"
          ls -R | grep -i xcodeproj

          # Ruta directa - es la que tiene tu repo
          PROJ="3105-2.0/ThreeOneOSFive.xcodeproj"

          xcodebuild -project "$PROJ" -target 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=15.0 SYMROOT=$(pwd)/build build

          APP_PATH="build/Build/Products/Release-iphoneos/3105.app"
          ls -lh build/Build/Products/Release-iphoneos/

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r azul.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL
          path: azul.ipa
