name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -version
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          echo "Proyecto: $PROJ"
          xcodebuild -project "$PROJ" -target 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=15.0 SYMROOT=$(pwd)/build build
          APP=$(find./build -name "*.app" -type d | head -n 1)
          echo "APP: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r azul.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL
          path: azul.ipa
