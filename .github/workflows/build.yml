name: build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y Parchear TODO a iOS 17
        run: |
          unzip -o Slowthv7-3105-2.0-source.zip
          find 3105-2.0 -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/g' {} \; 2>/dev/null || find 3105-2.0 -name "project.pbxproj" -exec sed -i -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/g' {} \;

          APP_FILE=$(find 3105-2.0 -name "App.swift" | head -n 1)
          python3 << 'PY'
          import pathlib, re, glob
          p = pathlib.Path(glob.glob("3105-2.0/**/App.swift", recursive=True)[0])
          c = p.read_text()
          c = c.replace("OnboardingStore.shouldShow()", "false")
          c = c.replace("OnboardingStore.markCompleted()", 'UserDefaults.standard.set(true, forKey: "onboarding.completed")')
          c = re.sub(r'.*OnboardingStore.*\n', '', c)
          c = re.sub(r'\.onChange\(of:\s*scenePhase\)[^\{]*\{', '.onChange(of: scenePhase) { newPhase in', c)
          c = c.replace("scenePhase ==.active", "newPhase ==.active")
          c = c.replace("phase ==.active", "newPhase ==.active")
          p.write_text(c)
          PY
      - name: Compilar IPA
        run: |
          PROJ=$(ls -d 3105-2.0/*.xcodeproj | head -n 1)
          xcodebuild -project "$PROJ" -scheme 3105 -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=17.0 SYMROOT=$(pwd)/build build
          mkdir -p Payload
          cp -R $(find build/Release-iphoneos -name "*.app" | head -n 1) Payload/
          zip -r azul.ipa Payload
      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA-AZUL-3105
          path: azul.ipa
