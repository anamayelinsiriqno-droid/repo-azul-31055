name: Build SLOWTH Unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          XCODE=$(find /Applications \
            -maxdepth 1 \
            -type d \
            -name "Xcode*.app" \
            | sort \
            | tail -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: No se encontró Xcode"
            ls -la /Applications | grep -i Xcode || true
            exit 1
          fi

          echo "Usando: $XCODE"

          sudo xcode-select -s "$XCODE/Contents/Developer"

          xcode-select -p
          xcodebuild -version

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find . \
            -type d \
            -name "*.xcodeproj" \
            -print \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Find Scheme
        id: scheme
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.PROJECT }}"

          echo "Proyecto:"
          echo "$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -list

          SCHEME=$(
            xcodebuild \
              -project "$PROJECT" \
              -list |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print $1
                exit
              }
            '
          )

          SCHEME=$(echo "$SCHEME" | xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró Scheme"
            exit 1
          fi

          echo "Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.PROJECT }}"
          SCHEME="${{ steps.scheme.outputs.SCHEME }}"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/SLOWTH.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Extract app
        shell: bash
        run: |
          set -e

          mkdir -p build/unsigned

          APP=$(find \
            build/SLOWTH.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró .app"
            exit 1
          fi

          cp -R "$APP" build/unsigned/

      - name: Create IPA
        shell: bash
        run: |
          set -e

          mkdir -p build/Payload
          cp -R build/unsigned/*.app build/Payload/

          cd build

          zip -r ../SLOWTH-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SLOWTH-unsigned-IPA
          path: SLOWTH-unsigned.ipa
          if-no-files-found: error
