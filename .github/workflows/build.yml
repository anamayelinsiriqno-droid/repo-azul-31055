name: Build 3105

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build 3105
    runs-on: macos-26

    env:
      PROJECT: 3105-2.0/ThreeOneOSFive.xcodeproj
      SCHEME: "3105"
      CONFIGURATION: Release
      SDK: iphoneos
      ARCHIVE_PATH: ${{ github.workspace }}/build/3105.xcarchive
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcode-select -p

      - name: Verify project
        run: |
          set -euo pipefail
          test -f "$PROJECT/project.pbxproj"
          xcodebuild -project "$PROJECT" -list

      - name: Clean
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            clean

      - name: Archive unsigned
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build/build.log

      - name: Locate app
        run: |
          set -euo pipefail
          find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name '*.app' -print
          test -d "$ARCHIVE_PATH/Products/Applications/3105.app"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/Payload build/3105-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$ARCHIVE_PATH/Products/Applications/3105.app" build/Payload/3105.app

          cd build
          /usr/bin/zip -qry 3105-unsigned.ipa Payload
          ls -lh 3105-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-diagnostics
          path: |
            build/build.log
            build/3105.xcarchive
          if-no-files-found: warn
          retention-days: 7
