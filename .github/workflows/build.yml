from pathlib import Path

workflow = r'''name: Build Slowth Dark Fantasy IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Xcode 15 / macOS 14 runner. The app's deployment target should remain iOS 12.0.
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15
        shell: bash
        run: |
          set -e

          echo "Installed Xcodes:"
          ls -1 /Applications | grep '^Xcode' || true

          # Prefer Xcode 15.4, then any Xcode 15.x available on the runner.
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          else
            XCODE15="$(find /Applications -maxdepth 1 -type d -name 'Xcode_15*.app' | sort -V | tail -n 1)"
            if [ -z "$XCODE15" ]; then
              echo "ERROR: No Xcode 15 installation was found on this runner."
              exit 1
            fi
            sudo xcode-select -s "$XCODE15/Contents/Developer"
          fi

          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator'

      - name: Find Xcode project or workspace
        id: project
        shell: bash
        run: |
          set -e

          PROJECT="$(find . -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          WORKSPACE="$(find . -maxdepth 4 -name '*.xcworkspace' -print -quit)"

          if [ -n "$WORKSPACE" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "build_path=$WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "build_path=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No .xcodeproj or .xcworkspace was found."
            echo "The Slowth Dark Fantasy UI patch contains Swift/resources only;"
            echo "it must be copied into the complete Xcode source project first."
            exit 1
          fi

          echo "Using: ${WORKSPACE:-$PROJECT}"

      - name: List schemes
        shell: bash
        run: |
          set -e
          if [ "${{ steps.project.outputs.kind }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" -list
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" -list
          fi

      - name: Select app scheme
        id: scheme
        shell: bash
        run: |
          set -e

          if [ -n "${SLOWTH_SCHEME:-}" ]; then
            echo "name=$SLOWTH_SCHEME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.project.outputs.kind }}" = "workspace" ]; then
            SCHEME="$(xcodebuild -workspace "${{ steps.project.outputs.path }}" -list |
              awk '/Schemes:/{flag=1;next} flag && NF{gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"
          else
            SCHEME="$(xcodebuild -project "${{ steps.project.outputs.path }}" -list |
              awk '/Schemes:/{flag=1;next} flag && NF{gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"
          fi

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not determine an Xcode scheme."
            echo "Set the repository variable SLOWTH_SCHEME to the exact scheme name."
            exit 1
          fi

          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Check deployment target
        shell: bash
        run: |
          set -e

          if [ "${{ steps.project.outputs.kind }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -showBuildSettings > build-settings.txt
          else
            xcodebuild \
              -project "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -showBuildSettings > build-settings.txt
          fi

          echo "Deployment target(s):"
          grep -E 'IPHONEOS_DEPLOYMENT_TARGET' build-settings.txt || true

          # The source should target iOS 12.0. A newer SDK may be used to build;
          # the deployment target is what controls device compatibility.
          if grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 1[3-9]' build-settings.txt; then
            echo "ERROR: Deployment target is above iOS 12."
            exit 1
          fi

      - name: Build unsigned Release app
        shell: bash
        run: |
          set -e
          rm -rf build

          COMMON_ARGS=(
            -scheme "${{ steps.scheme.outputs.name }}"
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$PWD/build/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )

          if [ "${{ steps.project.outputs.kind }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.path }}" \
              "${COMMON_ARGS[@]}" \
              clean build
          else
            xcodebuild \
              -project "${{ steps.project.outputs.path }}" \
              "${COMMON_ARGS[@]}" \
              clean build
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          # IPA is simply a ZIP containing Payload/*.app.
          cd build
          /usr/bin/zip -qry "Slowth-DarkFantasy-unsigned.ipa" Payload

          echo "Created:"
          ls -lh "Slowth-DarkFantasy-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slowth-DarkFantasy-IPA
          path: build/Slowth-DarkFantasy-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
'''

out = Path("/mnt/data/build-slowth.yml")
out.write_text(workflow, encoding="utf-8")
print(out)
