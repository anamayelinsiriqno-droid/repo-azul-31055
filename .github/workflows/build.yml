name: Build SLOWTH Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:

      # ─────────────────────────────
      # 1. Descargar la source
      # ─────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────
      # 2. Encontrar Xcode
      # ─────────────────────────────
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          echo "Buscando Xcode instalado..."

          XCODE=$(find /Applications \
            -maxdepth 1 \
            -type d \
            -name "Xcode*.app" \
            | sort \
            | tail -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: No se encontró Xcode."
            echo "Xcodes disponibles:"
            ls -la /Applications | grep -i Xcode || true
            exit 1
          fi

          echo "Xcode encontrado:"
          echo "$XCODE"

          sudo xcode-select -s "$XCODE/Contents/Developer"

          echo "Developer directory:"
          xcode-select -p

          echo "Versión:"
          xcodebuild -version


      # ─────────────────────────────
      # 3. Buscar .xcodeproj
      # ─────────────────────────────
      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto Xcode..."

          PROJECT=$(find . \
            -type d \
            -name "*.xcodeproj" \
            -print \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj."

            echo ""
            echo "Contenido del repositorio:"
            find . -maxdepth 4 -type f | sort | head -200

            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_OUTPUT"


      # ─────────────────────────────
      # 4. Mostrar información del proyecto
      # ─────────────────────────────
      - name: Show Xcode project
        run: |
          PROJECT="${{ steps.project.outputs.PROJECT }}"

          echo "Proyecto:"
          echo "$PROJECT"

          echo ""
          echo "Información del proyecto:"
          xcodebuild \
            -project "$PROJECT" \
            -list


      # ─────────────────────────────
      # 5. Encontrar Scheme
      # ─────────────────────────────
      - name: Find Scheme
        id: scheme
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.PROJECT }}"

          echo "Buscando Scheme..."

          SCHEME=$(
            xcodebuild \
              -project "$PROJECT" \
              -list |
            awk '
              /Schemes:/ {
                found=1
                next
              }

              found && NF {
                print $1
                exit
              }
            '
          )

          SCHEME=$(echo "$SCHEME" | xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró ningún Scheme."

            echo ""
            echo "Schemes disponibles:"
            xcodebuild \
              -project "$PROJECT" \
              -list

            exit 1
          fi

          echo "Scheme encontrado:"
          echo "$SCHEME"

          echo "SCHEME=$SCHEME" >> "$GITHUB_OUTPUT"


      # ─────────────────────────────
      # 6. Limpiar build anterior
      # ─────────────────────────────
      - name: Clean
        run: |
          rm -rf build
          mkdir -p build


      # ─────────────────────────────
      # 7. Compilar SIN FIRMA
      # ─────────────────────────────
      - name: Build unsigned
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.PROJECT }}"
          SCHEME="${{ steps.scheme.outputs.SCHEME }}"

          echo "Proyecto: $PROJECT"
          echo "Scheme: $SCHEME"

          echo ""
          echo "Iniciando build sin firma..."

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/SLOWTH.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive


      # ─────────────────────────────
      # 8. Verificar Archive
      # ─────────────────────────────
      - name: Verify archive
        shell: bash
        run: |
          set -e

          ARCHIVE="build/SLOWTH.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: No se creó el XCArchive."
            exit 1
          fi

          echo "Archive creado correctamente."

          echo ""
          echo "Contenido:"
          find "$ARCHIVE" -maxdepth 4 -type f | head -100


      # ─────────────────────────────
      # 9. Extraer .app
      # ─────────────────────────────
      - name: Extract unsigned app
        shell: bash
        run: |
          set -e

          mkdir -p build/unsigned

          APP=$(find \
            "build/SLOWTH.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró la aplicación .app."
            exit 1
          fi

          echo "App encontrada:"
          echo "$APP"

          cp -R "$APP" build/unsigned/


      # ─────────────────────────────
      # 10. Crear ZIP
      # ─────────────────────────────
      - name: Create unsigned ZIP
        shell: bash
        run: |
          set -e

          cd build/unsigned

          zip -r ../../SLOWTH-unsigned.zip *.app

          cd ../..

          echo "ZIP creado:"
          ls -lh SLOWTH-unsigned.zip


      # ─────────────────────────────
      # 11. Subir resultado
      # ─────────────────────────────
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: SLOWTH-unsigned
          path: SLOWTH-unsigned.zip
          if-no-files-found: error
